name: Signed Production Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  issues: read

jobs:
  validate:
    name: Validate signed release tag and source
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js 24.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - name: Require production-readiness issues to be completed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not publish while a runtime, credential, packaged-launch,
          # hardware-validation, documentation, licensing, dependency, or
          # storage-encryption migration security blocker remains open.
          for issue in 19 47 48 49 50 51 52 60 73; do
            response="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}")"
            state="$(jq -r '.state' <<<"$response")"
            reason="$(jq -r '.state_reason // empty' <<<"$response")"
            if [[ "$state" != "closed" || "$reason" != "completed" ]]; then
              echo "Release blocked: issue #${issue} is not closed as completed (state=${state}, reason=${reason})."
              exit 1
            fi
          done
      - name: Verify tag version, main commit, and GPG-signed tag (fail-closed)
        shell: bash
        env:
          RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          root_version="$(node -p "require('./package.json').version")"
          app_version="$(node -p "require('./app/package.json').version")"
          if [[ "$tag_version" != "$root_version" || "$tag_version" != "$app_version" ]]; then
            echo "Tag version $tag_version must match root ($root_version) and app ($app_version)."
            exit 1
          fi
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "Release tag must point to the exact current main commit that passed CI."
            echo "Tag: $GITHUB_SHA"
            echo "Main: $main_sha"
            exit 1
          fi
          if [[ -z "${RELEASE_GPG_PUBLIC_KEY:-}" ]]; then
            echo "Release blocked: RELEASE_GPG_PUBLIC_KEY secret is required for Signed Production Release."
            exit 1
          fi
          echo "Verifying GPG-signed release tag..."
          printf '%s' "$RELEASE_GPG_PUBLIC_KEY" | gpg --batch --import
          git verify-tag "$GITHUB_REF_NAME"
      - name: Validate complete 40-case physical-device evidence campaign and GPG sign-off (fail-closed)
        shell: bash
        env:
          RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          campaign_file="docs/testing/DEVICE_EVIDENCE_CAMPAIGN.json"
          campaign_sig="${campaign_file}.asc"
          if [[ ! -f "$campaign_file" ]]; then
            echo "Release blocked: required 40-case physical-device evidence campaign '$campaign_file' does not exist."
            exit 1
          fi
          if [[ ! -f "$campaign_sig" ]]; then
            echo "Release blocked: detached GPG signature '$campaign_sig' is required to cryptographically verify human release-owner sign-off on '$campaign_file'."
            echo "Sign the finalized campaign with the release GPG key:"
            echo "  gpg --armor --detach-sign --output $campaign_sig $campaign_file"
            exit 1
          fi
          if [[ -z "${RELEASE_GPG_PUBLIC_KEY:-}" ]]; then
            echo "Release blocked: RELEASE_GPG_PUBLIC_KEY secret is required to verify '$campaign_sig'."
            exit 1
          fi
          printf '%s' "$RELEASE_GPG_PUBLIC_KEY" | gpg --batch --import
          gpg --verify "$campaign_sig" "$campaign_file"
          # Verify campaign completeness, version match, and that candidate.commit is an ancestor of
          # GITHUB_SHA with ZERO non-evidence code/build/workflow changes between tested commit and tag.
          node scripts/validate-device-evidence.cjs "$campaign_file" --release-commit "$GITHUB_SHA" --expected-version "$tag_version"

  verify:
    name: Verify release source
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 24.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Restore Electron binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Electron binary for desktop smoke test
        working-directory: app
        shell: bash
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: |
          set +e
          for attempt in 1 2 3; do
            npx install-electron --no
            status=$?
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit "$status"; fi
            delay=$((attempt * 15))
            echo "Electron binary download failed (exit $status); retrying in $delay seconds."
            sleep "$delay"
          done
      - name: Enforce production dependency audit (reconciled with CI)
        run: npm audit --omit=dev --audit-level=high
      - name: Capture full and production dependency audit reports
        if: always()
        shell: bash
        run: |
          npm audit --json > npm-audit-full.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e "const fs=require('node:fs');for(const f of ['npm-audit-full.json','npm-audit-production.json']){const j=JSON.parse(fs.readFileSync(f,'utf8'));const v=j.metadata?.vulnerabilities||{};console.log(f,JSON.stringify(v));}"
      - name: Cache or download whisper model for automated test
        shell: bash
        run: |
          mkdir -p app/resources/whisper
          if [ ! -f "app/resources/whisper/ggml-tiny.en.bin" ]; then
            echo "Fetching ggml-tiny.en.bin model for automated transcription verification..."
            curl -L -s -o app/resources/whisper/ggml-tiny.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          fi
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python STT protocol tests
        shell: bash
        run: python app/python-stt/test_sidecar.py
      - name: Type check and lint
        run: npm run lint
      - name: Run unit and integration tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Run Electron UI/IPC smoke
        run: npm run smoke
      - name: Generate test evidence
        run: npm run test:report
      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-dependency-audit
          path: |
            npm-audit-full.json
            npm-audit-production.json
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Signed package (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-portable
            extension: .exe
          - os: macos-latest
            platform: macos-dmg
            extension: .dmg
          - os: ubuntu-latest
            platform: linux-appimage
            extension: .AppImage
    env:
      WIN_CSC_LINK: ${{ matrix.platform == 'windows-portable' && secrets.WINDOWS_CSC_LINK || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows-portable' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
      WINDOWS_EXPECTED_CERT_THUMBPRINT: ${{ matrix.platform == 'windows-portable' && secrets.WINDOWS_EXPECTED_CERT_THUMBPRINT || '' }}
      CSC_LINK: ${{ matrix.platform == 'macos-dmg' && secrets.MACOS_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos-dmg' && secrets.MACOS_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Require platform signing credentials (fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "windows-portable" ]]; then
            if [[ -z "${WIN_CSC_LINK:-}" || -z "${WIN_CSC_KEY_PASSWORD:-}" || -z "${WINDOWS_EXPECTED_CERT_THUMBPRINT:-}" ]]; then
              echo "Release blocked: WINDOWS_CSC_LINK, WINDOWS_CSC_KEY_PASSWORD, and WINDOWS_EXPECTED_CERT_THUMBPRINT are required for signed Windows releases."
              exit 1
            fi
            echo "Verified presence of Windows Authenticode signing secrets."
          elif [[ "${{ matrix.platform }}" == "macos-dmg" ]]; then
            if [[ -z "${CSC_LINK:-}" || -z "${CSC_KEY_PASSWORD:-}" || -z "${APPLE_ID:-}" || -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" || -z "${APPLE_TEAM_ID:-}" ]]; then
              echo "Release blocked: MACOS_CSC_LINK, MACOS_CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID are required for signed/notarized macOS releases."
              exit 1
            fi
            echo "Verified presence of macOS Developer ID & notarization secrets."
          else
            echo "Linux AppImage integrity is verified via GPG-signed SHA256SUMS.txt.asc in the publish job."
          fi
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 24.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Restore Electron and electron-builder caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/electron-cache
            ${{ runner.temp }}/electron-builder-cache
          key: electron-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-build-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Electron runtime for packaging
        working-directory: app
        shell: bash
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: |
          set +e
          for attempt in 1 2 3; do
            npx install-electron --no
            status=$?
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit "$status"; fi
            delay=$((attempt * 15))
            echo "Electron binary download failed (exit $status); retrying in $delay seconds."
            sleep "$delay"
          done
      - name: Build application
        run: npm run build
      - name: Install macOS DMG tooling
        if: matrix.platform == 'macos-dmg'
        working-directory: app
        run: npm install --no-save --package-lock=false --workspaces=false dmg-license@1.0.11
      - name: Remove unused optional PDF.js Node canvas stub
        working-directory: app
        run: node -e "const fs=require('node:fs');const p='node_modules/pdfjs-dist/node_modules/@napi-rs/canvas';fs.rmSync(p,{recursive:true,force:true});"
      - name: Install PortAudio build dependencies (Linux)
        if: matrix.platform == 'linux-appimage'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends portaudio19-dev libportaudio2 patchelf
      - name: Install PortAudio build dependencies (macOS)
        if: matrix.platform == 'macos-dmg'
        run: brew install portaudio
      - name: Provision checksum-verified standalone Python runtime
        run: node scripts/provision-python-runtime.cjs
      - name: Verify real RealtimeSTT transcription with bundled runtime
        shell: bash
        run: |
          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            PYTHON_EXE="app/resources/python/python.exe"
          else
            PYTHON_EXE="app/resources/python/bin/python3"
          fi
          export HF_HOME="$RUNNER_TEMP/huggingface-cache"
          "$PYTHON_EXE" app/python-stt/test_realtime_inference.py
      - name: Provision native macOS Whisper.cpp binary
        if: matrix.platform == 'macos-dmg'
        run: |
          mkdir -p app/resources/whisper
          echo "Building lightweight native whisper-cli for macOS..."
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper-src
          cmake -B /tmp/whisper-src/build -S /tmp/whisper-src -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build /tmp/whisper-src/build --config Release --target whisper-cli -j4
          cp /tmp/whisper-src/build/bin/whisper-cli app/resources/whisper/whisper-cli
          chmod +x app/resources/whisper/whisper-cli
      - name: Provision native Linux Whisper.cpp binary
        if: matrix.platform == 'linux-appimage'
        run: |
          mkdir -p app/resources/whisper
          echo "Downloading official Ubuntu x64 whisper.cpp binary..."
          curl -L -s https://github.com/ggml-org/whisper.cpp/releases/download/b5454/whisper-bin-ubuntu-x64.tar.gz | tar -xz -C /tmp
          cp /tmp/whisper-bin-ubuntu-x64/whisper-cli app/resources/whisper/
          cp -a /tmp/whisper-bin-ubuntu-x64/*.so* app/resources/whisper/
          chmod +x app/resources/whisper/whisper-cli
      - name: Create strict signed release packaging configuration
        working-directory: app
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          node -e "const fs=require('node:fs');const pkg=require('./package.json');if(!pkg.build)throw new Error('Missing electron-builder configuration');const config={...pkg.build,forceCodeSigning:process.env.RELEASE_PLATFORM!=='linux-appimage'};if(process.env.RELEASE_PLATFORM==='macos-dmg'){config.mac={...pkg.build.mac,notarize:true};}fs.writeFileSync('.release-builder.json',JSON.stringify(config,null,2));"
      - name: Build signed production distributable
        working-directory: app
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: npx electron-builder --publish never --config .release-builder.json
      - name: Verify Windows Authenticode signature and expected certificate
        if: matrix.platform == 'windows-portable'
        shell: pwsh
        run: |
          $exe = Get-ChildItem app/release -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "Windows release executable was not produced." }
          $signature = Get-AuthenticodeSignature $exe.FullName
          if ($signature.Status -ne "Valid") { throw "Windows Authenticode signature is not valid: $($signature.Status)" }
          if (-not $signature.SignerCertificate) { throw "Windows executable has no signer certificate." }
          $rawExpected = $env:WINDOWS_EXPECTED_CERT_THUMBPRINT
          if (-not $rawExpected) { throw "Set WINDOWS_EXPECTED_CERT_THUMBPRINT to the approved certificate thumbprint." }
          $expected = (($rawExpected -replace '\s', '')).ToUpperInvariant()
          if ($expected.Length -ne 40 -or $expected -match '[^0-9A-F]') { throw "WINDOWS_EXPECTED_CERT_THUMBPRINT must contain exactly 40 hexadecimal characters." }
          $actual = (($signature.SignerCertificate.Thumbprint -replace '\s', '')).ToUpperInvariant()
          if ($actual -ne $expected) { throw "Unexpected Authenticode certificate thumbprint. Actual: $actual; expected: $expected" }
          Write-Host "Verified expected signed publisher:" $signature.SignerCertificate.Subject
      - name: Verify macOS code signature, expected Team ID, and notarization
        if: matrix.platform == 'macos-dmg'
        shell: bash
        run: |
          set -euo pipefail
          app_bundle="$(find app/release -maxdepth 4 -type d -name '*.app' -print -quit)"
          dmg="$(find app/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$app_bundle" || -z "$dmg" ]]; then
            echo "Expected signed .app bundle and DMG were not produced."
            exit 1
          fi
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "APPLE_TEAM_ID must be the expected 10-character Apple Developer Team ID."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          signature_details="$(codesign -dv --verbose=4 "$app_bundle" 2>&1)"
          printf '%s\n' "$signature_details"
          team_id="$(printf '%s\n' "$signature_details" | sed -n 's/^TeamIdentifier=//p' | head -n 1)"
          authority="$(printf '%s\n' "$signature_details" | sed -n 's/^Authority=//p' | head -n 1)"
          if [[ "$team_id" != "$APPLE_TEAM_ID" ]]; then
            echo "Unexpected macOS signing TeamIdentifier: ${team_id:-missing}; expected $APPLE_TEAM_ID."
            exit 1
          fi
          if [[ "$authority" != "Developer ID Application:"* ]]; then
            echo "Expected a Developer ID Application signature, got: ${authority:-missing}."
            exit 1
          fi
          xcrun stapler validate "$dmg"
      - name: Verify expected Linux AppImage
        if: matrix.platform == 'linux-appimage'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find app/release -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [[ -z "$appimage" ]]; then echo "Linux AppImage was not produced"; exit 1; fi
          chmod +x "$appimage"
      - name: Ensure Linux virtual display is available
        if: matrix.platform == 'linux-appimage'
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Launch-test packaged Windows executable
        if: matrix.platform == 'windows-portable'
        shell: pwsh
        run: |
          $unpacked = Get-ChildItem app/release/win-unpacked -Filter *.exe | Select-Object -First 1
          if ($unpacked) {
            node app/tests/packaged-smoke.cjs $unpacked.FullName
          } else {
            $exe = Get-ChildItem app/release -Filter *.exe | Select-Object -First 1
            if (-not $exe) { throw "No portable Windows executable found in app/release." }
            node app/tests/packaged-smoke.cjs $exe.FullName
          }
      - name: Launch-test packaged macOS application
        if: matrix.platform == 'macos-dmg'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find app/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then echo "No macOS DMG found"; exit 1; fi
          mount_dir="$RUNNER_TEMP/scandium-release-dmg"
          app_copy="$RUNNER_TEMP/Scandium.app"
          mkdir -p "$mount_dir"
          hdiutil attach "$dmg" -nobrowse -quiet -mountpoint "$mount_dir"
          cleanup() { hdiutil detach "$mount_dir" -quiet || true; }
          trap cleanup EXIT
          app_bundle="$(find "$mount_dir" -maxdepth 3 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_bundle" ]]; then echo "No app bundle found in DMG"; exit 1; fi
          ditto "$app_bundle" "$app_copy"
          hdiutil detach "$mount_dir" -quiet
          trap - EXIT
          binary="$(find "$app_copy/Contents/MacOS" -maxdepth 1 -type f -perm +111 -print -quit || find "$app_copy/Contents/MacOS" -maxdepth 1 -type f -print -quit)"
          if [[ -z "$binary" ]]; then echo "No executable found in $app_copy/Contents/MacOS"; exit 1; fi
          echo "Found packaged macOS executable: $binary"
          node app/tests/packaged-smoke.cjs "$binary"
      - name: Launch-test packaged Linux AppImage
        if: matrix.platform == 'linux-appimage'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find app/release -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          chmod +x "$appimage"
          node app/tests/packaged-smoke.cjs "$appimage"
      - name: Upload signed platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: app/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release and GPG-signed checksums
    needs: [validate, verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Require all three platform assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -print
          for ext in exe dmg AppImage; do
            if ! find release-assets -maxdepth 1 -type f -iname "*.$ext" | grep -q .; then
              echo "Missing production release artifact: .$ext"
              exit 1
            fi
          done
      - name: Generate and GPG-sign SHA-256 manifest (fail-closed)
        shell: bash
        env:
          RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_GPG_PUBLIC_KEY:-}" || -z "${RELEASE_GPG_PRIVATE_KEY:-}" || -z "${RELEASE_GPG_PASSPHRASE:-}" ]]; then
            echo "Release blocked: RELEASE_GPG_PUBLIC_KEY, RELEASE_GPG_PRIVATE_KEY, and RELEASE_GPG_PASSPHRASE are required to sign SHA256SUMS.txt.asc."
            exit 1
          fi
          cd release-assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          printf '%s' "$RELEASE_GPG_PUBLIC_KEY" | gpg --batch --import
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$RELEASE_GPG_PASSPHRASE" --armor --detach-sign --output SHA256SUMS.txt.asc SHA256SUMS.txt
          gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt
      - name: Publish signed versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --title "Scandium $GITHUB_REF_NAME" --generate-notes --verify-tag
