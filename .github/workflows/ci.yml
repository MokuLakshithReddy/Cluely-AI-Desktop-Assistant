name: CI Verification Suite

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build & Verify (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Capture npm audit report
        shell: bash
        run: npm audit --json > npm-audit.json || true
      - name: Reject unapproved high and critical npm advisories
        run: npm audit --audit-level=high
      - name: Upload npm audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run Type Check & Lint
        run: npm run lint
      - name: Run Vitest Suite
        run: npm test
      - name: Build Renderer and Electron Bundle
        run: npm run build
      - name: Run Verified Electron Smoke Test (Clean exit code 0)
        run: npm run smoke
      - name: Generate Automated Test Evidence Report
        run: npm run test:report
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cluely-desktop-build
          path: |
            app/dist
            app/dist-electron
          retention-days: 7
      - name: Upload Test Evidence Report
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: docs/testing/TEST_RESULTS.md
          retention-days: 14
  package:
    name: Package Electron (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-portable
            expected-extension: .exe
          - os: macos-latest
            platform: macos-dmg
            expected-extension: .dmg
          - os: ubuntu-latest
            platform: linux-appimage
            expected-extension: .AppImage
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Install macOS-only optional DMG tooling omitted from the Windows-generated lockfile
        if: matrix.platform == 'macos-dmg'
        working-directory: app
        run: npm install --no-save --package-lock=false --workspaces=false dmg-license@1.0.11
      - name: Remove unused PDF.js optional Node canvas stub before packaging
        working-directory: app
        run: node -e "const fs=require('node:fs');const p='node_modules/pdfjs-dist/node_modules/@napi-rs/canvas';if(fs.existsSync(p)||fs.lstatSync(p,{throwIfNoEntry:false})){fs.rmSync(p,{recursive:true,force:true});console.log('Removed PDF.js optional Node canvas stub; renderer uses the browser build.')}else{console.log('No optional Node canvas stub present.')}"
      - name: Create unsigned electron-builder CI configuration
        working-directory: app
        run: node -e "const fs=require('node:fs');const pkg=require('./package.json');if(!pkg.build)throw new Error('Missing electron-builder configuration');fs.writeFileSync('.electron-builder-ci.json',JSON.stringify({...pkg.build,forceCodeSigning:false},null,2))"
      - name: Create platform distributable (unsigned PR validation)
        working-directory: app
        run: npx electron-builder --publish never --config .electron-builder-ci.json
      - name: Verify expected distributable exists
        env:
          EXPECTED_EXTENSION: ${{ matrix.expected-extension }}
        run: node -e "const fs=require('fs');const p='app/release';const ext=process.env.EXPECTED_EXTENSION;const files=fs.existsSync(p)?fs.readdirSync(p):[];const matches=files.filter(f=>f.endsWith(ext));if(!matches.length){console.error('Missing '+ext+' artifact in '+p,files);process.exit(1)}console.log('Verified package artifact(s):',matches)"
      - name: Smoke-test packaged Windows executable
        if: matrix.platform == 'windows-portable'
        shell: pwsh
        run: |
          $exe = Get-ChildItem app/release -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No portable Windows executable found in app/release." }
          node app/tests/packaged-smoke.cjs $exe.FullName

      - name: Smoke-test packaged macOS application
        if: matrix.platform == 'macos-dmg'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find app/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then echo "No macOS DMG found"; exit 1; fi
          mount_dir="$RUNNER_TEMP/cluely-dmg"
          app_copy="$RUNNER_TEMP/Cluely Copilot.app"
          mkdir -p "$mount_dir"
          hdiutil attach "$dmg" -nobrowse -quiet -mountpoint "$mount_dir"
          cleanup() { hdiutil detach "$mount_dir" -quiet || true; }
          trap cleanup EXIT
          app_bundle="$(find "$mount_dir" -maxdepth 3 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_bundle" ]]; then echo "No .app bundle found in DMG"; exit 1; fi
          ditto "$app_bundle" "$app_copy"
          hdiutil detach "$mount_dir" -quiet
          trap - EXIT
          node app/tests/packaged-smoke.cjs "$app_copy/Contents/MacOS/Cluely Copilot"

      - name: Ensure Linux virtual display is available
        if: matrix.platform == 'linux-appimage'
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Smoke-test packaged Linux AppImage
        if: matrix.platform == 'linux-appimage'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find app/release -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [[ -z "$appimage" ]]; then echo "No Linux AppImage found"; exit 1; fi
          chmod +x "$appimage"
          node app/tests/packaged-smoke.cjs "$appimage"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: cluely-${{ matrix.platform }}
          path: app/release/*
          if-no-files-found: error
          retention-days: 14

  release-contract:
    name: Validate Release Tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tag version to match package versions and tested main
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          root_version="$(node -p "require('./package.json').version")"
          app_version="$(node -p "require('./app/package.json').version")"
          if [[ "$tag_version" != "$root_version" || "$tag_version" != "$app_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME must match root ($root_version) and app ($app_version) package versions."
            exit 1
          fi
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "Release tag must point at the exact main commit that passed CI."
            echo "Tag: $GITHUB_SHA"
            echo "Main: $main_sha"
            exit 1
          fi
