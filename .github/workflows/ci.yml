name: CI Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Build & Verify (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check & Lint
        run: npm run lint

      - name: Run Vitest Suite
        run: npm test

      - name: Build Renderer and Electron Bundle
        run: npm run build

      - name: Run Verified Electron Smoke Test (Clean exit code 0)
        run: npm run smoke

      - name: Generate Automated Test Evidence Report
        run: npm run test:report

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cluely-desktop-build
          path: |
            app/dist
            app/dist-electron
          retention-days: 7

      - name: Upload Test Evidence Report
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: docs/testing/TEST_RESULTS.md
          retention-days: 14
