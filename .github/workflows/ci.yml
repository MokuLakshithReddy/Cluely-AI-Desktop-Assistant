name: CI Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Build & Verify (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run Vitest Suite (61 unit & integration tests across 8 suites)
        working-directory: app
        run: npm test

      - name: Build Renderer and Electron Bundle
        working-directory: app
        run: npm run build

      - name: Run Verified Electron Smoke Test (1 runtime smoke test with clean exit code 0)
        working-directory: app
        run: node tests/electron-smoke.cjs

      - name: Generate Automated Test Evidence Report (62 total verified tests)
        working-directory: app
        run: npm run test:report

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cluely-desktop-build
          path: |
            app/dist
            app/dist-electron
          retention-days: 7

      - name: Upload Test Evidence Report
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: docs/testing/TEST_RESULTS.md
          retention-days: 14

